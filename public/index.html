<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comptabilité notariale</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="connexion" class="ecran-connexion">
  <form id="form-connexion" class="carte-connexion">
    <h1>Comptabilité notariale</h1>
    <p class="sous-titre">Office notarial — Nouvelle-Calédonie</p>
    <label>Identifiant <input name="identifiant" autocomplete="username" required></label>
    <label>Mot de passe <input name="motDePasse" type="password" autocomplete="current-password" required></label>
    <button type="submit">Se connecter</button>
    <p id="erreur-connexion" class="erreur"></p>
  </form>
</div>

<div id="application" hidden>
  <header class="bandeau">
    <div class="identite">
      <strong id="nom-office">Office</strong>
      <span id="exercice-courant" class="etiquette"></span>
    </div>
    <nav id="menu">
      <button data-vue="tableau">Tableau de bord</button>
      <button data-vue="saisie">Saisie</button>
      <button data-vue="ecritures">Écritures</button>
      <button data-vue="dossiers">Dossiers</button>
      <button data-vue="rapprochement">Rapprochement</button>
      <button data-vue="etats">États</button>
      <button data-vue="caisse">Caisse</button>
      <button data-vue="inspection">Inspection</button>
    </nav>
    <div class="utilisateur">
      <span id="nom-utilisateur"></span>
      <button id="btn-deconnexion" class="lien">Quitter</button>
    </div>
  </header>

  <main id="contenu"></main>
</div>

<div id="bandeau-message" class="message" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
